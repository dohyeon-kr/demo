<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="dohyeon-kr demo 페이지 인덱스" />
  <title>demo</title>
  <link rel="icon" href="data:," />
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f7f7f4;
      --paper: #ffffff;
      --fg: #171916;
      --muted: #6a6f68;
      --line: #e1e4de;
      --hover: #f0f3ee;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #111411;
        --paper: #181c18;
        --fg: #eef1eb;
        --muted: #a2aaa1;
        --line: #303630;
        --hover: #202620;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      padding: 4.5rem 1.25rem;
      background: var(--bg);
      color: var(--fg);
      font: 16px/1.65 -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans KR", sans-serif;
      letter-spacing: -0.015em;
    }
    main { max-width: 48rem; margin: 0 auto; }
    header { margin-bottom: 2.5rem; }
    h1 {
      margin: 0 0 .5rem;
      font-size: clamp(2.1rem, 6vw, 3.5rem);
      line-height: 1.1;
      letter-spacing: -.05em;
    }
    header p { margin: 0; color: var(--muted); }
    .grid { display: grid; gap: .75rem; }
    .card {
      display: block;
      padding: 1.25rem 1.35rem;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: var(--paper);
      color: inherit;
      text-decoration: none;
      transition: transform .12s ease, background .12s ease, border-color .12s ease;
    }
    .card:hover {
      transform: translateY(-2px);
      background: var(--hover);
    }
    .card h2 {
      margin: 0;
      font-size: 1.05rem;
      line-height: 1.4;
      letter-spacing: -.025em;
    }
    .card p {
      margin: .45rem 0 0;
      color: var(--muted);
      font-size: .9rem;
    }
    .path { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    .empty { color: var(--muted); }
    footer { margin-top: 2rem; color: var(--muted); font-size: .8rem; }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>demo</h1>
      <p>저장소의 페이지를 <code>&lt;title&gt;</code> 기준으로 자동 인덱싱합니다.</p>
    </header>

    <section class="grid" aria-label="페이지 목록">
      <!-- AUTO_INDEX_START -->
      <p class="empty">배포 시 페이지 목록이 자동으로 생성됩니다.</p>
        <!-- AUTO_INDEX_END -->
    </section>

    <footer>새로운 <code>*/index.html</code>을 추가하면 다음 배포에서 자동 반영됩니다.</footer>
  </main>
</body>
</html>
